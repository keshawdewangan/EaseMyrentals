services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easemyrentals}
      POSTGRES_USER: ${POSTGRES_USER:-easemyrentals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # DB not exposed to host in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easemyrentals} -d ${POSTGRES_DB:-easemyrentals}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-easemyrentals}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-easemyrentals}
      PORT: 8000
      BIND_ADDRESS: 0.0.0.0
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-EaseMyRentals Admin}
    # App not directly exposed — nginx is the entry point

  nginx:
    image: nginx:1.25-alpine
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    
  # Uncomment after you have a domain to get free SSL
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ./certbot/www:/var/www/certbot
  #     - ./certbot/conf:/etc/letsencrypt
  #   command: certonly --webroot --webroot-path=/var/www/certbot
  #             --email your@email.com --agree-tos --no-eff-email
  #             -d yourdomain.com -d www.yourdomain.com

# ⚠️  NEVER run 'docker compose down -v' — it will destroy all your data.
# To stop safely: 'docker compose down'  (volume is kept)
# To backup: './backup.sh'
volumes:
  postgres_data:
    name: emr_postgres_prod_data
